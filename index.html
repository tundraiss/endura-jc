<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b91c1c"><link rel="manifest" href="manifest.webmanifest"><title>ENDURA JC | Job Tracker</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#1f2937;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#991b1b;color:white;padding:16px max(18px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:21px;letter-spacing:.5px}header small{display:block;opacity:.85}main{max-width:1180px;margin:auto;padding:20px 16px 80px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.nav button{border:1px solid #e2e4e9;background:white;border-radius:9px;padding:10px 15px;color:#374151}.nav button.active{background:#991b1b;color:white;border-color:#991b1b}.btn{background:#b91c1c;color:white;border:0;border-radius:9px;padding:11px 15px;font-weight:650}.btn.secondary{background:white;color:#991b1b;border:1px solid #d5d8df}.btn.gray{background:#334155}.btn:disabled{opacity:.5;cursor:not-allowed}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}.muted{color:#64748b}.small{font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat,.panel,.job{background:white;border:1px solid #e5e7eb;border-radius:13px;padding:16px;box-shadow:0 2px 8px #0f172a06}.stat strong{font-size:29px;display:block;margin-top:6px}.stat.red strong{color:#b91c1c}.stat.green strong{color:#15803d}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.jobs{display:grid;gap:11px}.job{display:flex;align-items:center;justify-content:space-between;gap:12px}.job h3{font-size:16px;margin:0 0 6px}.job p{margin:4px 0;font-size:13px}.job .actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;padding:4px 8px;border-radius:99px;background:#eef2f7;font-size:12px;font-weight:700}.pill.overdue{background:#fee2e2;color:#991b1b}.pill.urgent{background:#ffedd5;color:#9a3412}.pill.ontrack{background:#dcfce7;color:#166534}.pill.done{background:#e0e7ff;color:#3730a3}label{font-size:13px;font-weight:650;display:block;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px 11px;background:white;color:#111827}textarea{min-height:72px;resize:vertical}.field{margin-bottom:13px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 15px}.full{grid-column:1/-1}.inline{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.itemrow{display:grid;grid-template-columns:2fr 80px 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}.itemrow button{padding:10px}.note{background:#fff7ed;border:1px solid #fed7aa;padding:12px;border-radius:10px;font-size:13px}.hidden{display:none!important}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.filters input{max-width:280px}.section{margin-bottom:20px}.empty{padding:30px;text-align:center;color:#64748b;background:white;border:1px dashed #cbd5e1;border-radius:12px}.stage{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.stage span{padding:7px 10px;background:#f1f5f9;border-radius:8px;font-size:12px}.stage span.current{background:#991b1b;color:white}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.log{border-left:3px solid #e5e7eb;padding:5px 0 7px 12px;font-size:13px}.log time{color:#64748b;font-size:11px}.photo{max-height:100px;max-width:120px;object-fit:cover;border-radius:8px;margin:5px}.banner{padding:12px;border-radius:10px;background:#fef2f2;color:#7f1d1d;margin-bottom:15px;font-size:13px}a{color:#991b1b}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.count{font-size:12px;color:#64748b}.footer{margin-top:30px;color:#64748b;font-size:12px}dialog{border:0;border-radius:16px;padding:0;width:min(760px,calc(100% - 20px));max-height:92vh;box-shadow:0 15px 50px #0004}dialog::backdrop{background:#11182799}.modal{padding:20px;overflow:auto;max-height:90vh}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.close{border:0;background:#f1f5f9;border-radius:8px;padding:7px 11px}.check{display:flex;align-items:center;gap:8px;font-weight:400}.check input{width:auto}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.grid,.formgrid{grid-template-columns:1fr}.job{align-items:stretch;flex-direction:column}.itemrow{grid-template-columns:1fr 70px}.itemrow>*:first-child{grid-column:1/-1}.itemrow button{grid-column:2}.nav button{flex:1}header{padding:14px 16px}.topline{align-items:flex-start}}@media print{header,.nav,.toolbar,.btn,.filters,.footer,.no-print{display:none!important}main{padding:0}.panel,.job{box-shadow:none}}
</style></head><body><header><div><strong>ENDURA JC</strong><small>EnduraCoat · Simple Job Tracker</small></div><span class="small">v3.1 · Local prototype</span></header><main><div class="nav"><button data-view="dashboard" class="active">Dashboard</button><button data-view="jobs">Job Cards</button><button data-view="ready">Ready / Collected</button><button data-view="messages">Delay Reviews</button></div><div id="app"></div><div class="footer">Local demo: information is saved only in this browser. Automatic collection WhatsApp and Sage retrieval require a connected server; this demo safely queues collection sends without transmitting them. No cloud sync is active.</div></main><dialog id="dialog"><div class="modal" id="modal"></div></dialog><script>
'use strict';
const KEY='endura-jc-v3-data',STAGES=['New Job','Pretreatment','Powder Coating','Curing / QC','Ready for Collection','Collected'];
let db=load(),view='dashboard',filter='all',search='';
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.jobs))return d}catch(e){}return {jobs:[],next:1}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Browser storage is full. Export a backup and remove large attachments.')}}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function days(date){if(!date)return null;const [y,m,d]=date.split('-').map(Number);const a=new Date(y,m-1,d),b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/86400000)}
function urgency(j){if(j.stage>=4)return {t:j.stage===5?'Collected':'Completed',c:'done'};let d=days(j.due);return d===null?{t:'No due date',c:''}:d<0?{t:`Overdue ${-d}d`,c:'overdue'}:d<=1?{t:d===0?'Due today':'Due tomorrow',c:'urgent'}:d<=2?{t:`Due in ${d}d`,c:'urgent'}:{t:`${d}d remaining`,c:'ontrack'}}
function itemSummary(j){return j.items.map(i=>`${i.qty} × ${i.name}${i.colour?' ('+i.colour+')':''}`).join(', ')}
function fmt(dt){return dt?new Date(dt).toLocaleString('en-ZA',{dateStyle:'medium',timeStyle:'short'}):'—'}
function fmtDate(s){return s?new Date(s+'T12:00:00').toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'}):'—'}
function notify(j,type){j.messages??=[];if(!j.messages.some(m=>m.type===type&&m.status==='pending'))j.messages.push({id:crypto.randomUUID(),type,status:'pending',created:new Date().toISOString()})}
function log(j,detail){j.history??=[];j.history.unshift({date:new Date().toISOString(),detail})}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('app').innerHTML=({dashboard:dashboard,jobs:jobsPage,ready:readyPage,messages:messagesPage}[view])()}
function badge(j){let u=urgency(j);return `<span class="pill ${u.c}">${esc(u.t)}</span>`}
function card(j){return `<div class="job"><div><h3>${esc(j.number)} · ${esc(j.customer)}</h3><p>${esc(itemSummary(j))}</p><p class="muted">${esc(STAGES[j.stage])} · Due ${fmtDate(j.due)} · ${esc(j.phone||'No phone')}</p></div><div class="actions">${badge(j)} <button class="btn secondary" onclick="openJob('${j.id}')">Open</button></div></div>`}
function dashboard(){let active=db.jobs.filter(j=>j.stage<4),late=active.filter(j=>days(j.due)<0),urgent=active.filter(j=>{let d=days(j.due);return d!==null&&d>=0&&d<=2}),ready=db.jobs.filter(j=>j.stage===4),stale=active.filter(j=>(Date.now()-new Date(j.updated).getTime())>48*3600000);return `<div class="topline"><h1>Dashboard</h1><button class="btn" onclick="newJob()">+ New Job Card</button></div><div class="stats"><div class="stat">Active Jobs<strong>${active.length}</strong></div><div class="stat red">Overdue<strong>${late.length}</strong></div><div class="stat red">Urgent (≤2 days)<strong>${urgent.length}</strong></div><div class="stat green">Ready to Collect<strong>${ready.length}</strong></div></div>${late.length?`<div class="banner"><strong>Attention:</strong> ${late.length} overdue job(s). Open them to revise the due date and prepare a delay WhatsApp for approval.</div>`:''}<div class="grid"><section class="panel"><h2>Needs attention</h2><div class="jobs">${[...new Set([...late,...urgent,...stale])].slice(0,8).map(card).join('')||'<p class="muted">No urgent jobs. Add your first job card.</p>'}</div></section><section class="panel"><h2>Latest jobs</h2><div class="jobs">${db.jobs.slice().sort((a,b)=>b.created.localeCompare(a.created)).slice(0,7).map(card).join('')||'<p class="muted">No jobs yet.</p>'}</div></section></div><div class="section" style="margin-top:15px"><div class="note"><strong>Reminder rule:</strong> Due within 2 days = urgent; past due = overdue; no update for 48 hours = stalled. These reminders appear when you open the app. Automatic push notifications require a hosted service.</div></div>`}
function jobsPage(){let list=db.jobs.filter(j=>(filter==='all'||(filter==='active'&&j.stage<4)||(filter==='late'&&j.stage<4&&days(j.due)<0)||String(j.stage)===filter)&&[j.number,j.customer,j.phone,itemSummary(j)].join(' ').toLowerCase().includes(search.toLowerCase())).sort((a,b)=>(a.stage>=4)-(b.stage>=4)||(a.due||'9999').localeCompare(b.due||'9999'));return `<div class="topline"><h1>Job Cards <span class="count">(${list.length})</span></h1><button class="btn" onclick="newJob()">+ New Job Card</button></div><div class="filters"><input id="search" placeholder="Search job, customer or item" value="${esc(search)}" oninput="search=this.value;renderKeepSearch()"><select style="max-width:220px" onchange="filter=this.value;render()"><option value="all" ${filter==='all'?'selected':''}>All jobs</option><option value="active" ${filter==='active'?'selected':''}>Active jobs</option><option value="late" ${filter==='late'?'selected':''}>Overdue jobs</option>${STAGES.map((s,i)=>`<option value="${i}" ${filter===String(i)?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="jobs">${list.map(card).join('')||'<div class="empty">No matching job cards.</div>'}</div>`}
function renderKeepSearch(){let p=document.getElementById('search').selectionStart;render();let e=document.getElementById('search');e.focus();e.setSelectionRange(p,p)}
function readyPage(){let list=db.jobs.filter(j=>j.stage>=4).sort((a,b)=>b.updated.localeCompare(a.updated));return `<div class="topline"><h1>Ready / Collected</h1></div><div class="jobs">${list.map(card).join('')||'<div class="empty">Completed jobs will appear here.</div>'}</div>`}
function messagesPage(){let entries=db.jobs.flatMap(j=>(j.messages||[]).map(m=>({j,m}))).filter(x=>x.m.type==='delay'&&x.m.status==='pending').sort((a,b)=>b.m.created.localeCompare(a.m.created));return `<div class="topline"><h1>Delay Reviews</h1><span class="pill">${entries.length} pending</span></div><div class="note" style="margin-bottom:14px">Only delay notifications need your approval. Collection notifications are queued automatically for the live WhatsApp service, which is not connected in this demo.</div><div class="jobs">${entries.map(({j,m})=>`<div class="job"><div><h3>${esc(j.number)} · ${esc(j.customer)}</h3><p>Delay update · ${esc(j.phone||'Phone missing')}</p><p class="muted">${esc(messageText(j,'delay'))}</p></div><div class="actions"><button class="btn" onclick="approve('${j.id}','${m.id}')">Review</button></div></div>`).join('')||'<div class="empty">No delay messages awaiting approval.</div>'}</div>`}
function messageText(j,type){return type==='ready'?`Good day ${j.customer}, your EnduraCoat powder coating order ${j.number} is ready for collection. Please see the invoice PDF attached. Thank you for choosing EnduraCoat.`:`Good day ${j.customer}, we would like to update you on your EnduraCoat order ${j.number}. There has been a delay in production. Our revised expected completion date is ${fmtDate(j.due)}. We apologise for the inconvenience and appreciate your patience.`}
function normalizePhone(s){let p=String(s||'').replace(/\D/g,'');if(p.startsWith('0'))p='27'+p.slice(1);return p}
function approve(id,mid){let j=db.jobs.find(j=>j.id===id),m=j.messages.find(m=>m.id===mid);if(!m||m.type!=='delay')return;let txt=messageText(j,'delay'),p=normalizePhone(j.phone);show(`<div class="modalhead"><h2>Review Delay WhatsApp</h2><button class="close" onclick="closeModal()">✕</button></div><p><b>${esc(j.customer)}</b> · ${esc(j.phone)}</p><div class="field"><label>Message (editable)</label><textarea id="msg" rows="6">${esc(txt)}</textarea></div><div class="toolbar" style="margin-top:14px"><button class="btn" ${p.length<10?'disabled':''} onclick="launchWA('${id}','${mid}')">Open WhatsApp</button><button class="btn secondary" onclick="markSent('${id}','${mid}')">Mark as Sent</button><button class="btn secondary" onclick="dismiss('${id}','${mid}')">Dismiss</button></div><p class="muted">Demo: opening WhatsApp does not send the message automatically. Mark as sent only after sending.</p>`)}
function launchWA(id,mid){let j=db.jobs.find(j=>j.id===id),p=normalizePhone(j.phone);let txt=document.getElementById('msg').value;window.open(`https://wa.me/${encodeURIComponent(p)}?text=${encodeURIComponent(txt)}`,'_blank','noopener')}
function markSent(id,mid){setMsg(id,mid,'sent')};function dismiss(id,mid){setMsg(id,mid,'dismissed')};function setMsg(id,mid,status){let j=db.jobs.find(j=>j.id===id),m=j.messages.find(m=>m.id===mid);m.status=status;log(j,`WhatsApp ${m.type} marked ${status}`);save();closeModal();render()}
function show(html){document.getElementById('modal').innerHTML=html;document.getElementById('dialog').showModal()};function closeModal(){document.getElementById('dialog').close()}
function itemRow(i={name:'',qty:1,colour:'',status:'New Job'}){return `<div class="itemrow"><div><label>Item description</label><input class="iname" placeholder="e.g. Steel frames" value="${esc(i.name)}" required></div><div><label>Qty</label><input class="iqty" type="number" min="1" value="${Number(i.qty)||1}"></div><div><label>Colour</label><input class="icolour" placeholder="e.g. Matt black" value="${esc(i.colour)}"></div><div><label>Progress</label><select class="istatus">${STAGES.slice(0,5).map(s=>`<option ${i.status===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><button type="button" class="btn secondary" onclick="this.closest('.itemrow').remove()" aria-label="Remove item">✕</button></div>`}
function addItem(){document.getElementById('items').insertAdjacentHTML('beforeend',itemRow())}
function newJob(id){let j=id?db.jobs.find(j=>j.id===id):null;show(`<div class="modalhead"><h2>${j?'Edit '+esc(j.number):'New Job Card'}</h2><button class="close" onclick="closeModal()">✕</button></div><form id="jobform" onsubmit="submitJob(event,'${j?.id||''}')"><div class="formgrid"><div class="field"><label>Customer / Company *</label><input name="customer" required value="${esc(j?.customer||'')}"></div><div class="field"><label>WhatsApp number *</label><input name="phone" type="tel" required placeholder="082 123 4567" value="${esc(j?.phone||'')}"></div><div class="field"><label>Date received</label><input name="received" type="date" value="${esc(j?.received||today())}"></div><div class="field"><label>Promised completion *</label><input name="due" type="date" required value="${esc(j?.due||'')}"></div><div class="field full"><label>Notes / special instructions</label><textarea name="notes">${esc(j?.notes||'')}</textarea></div></div><h3>Items on this job card</h3><div id="items">${(j?.items||[{name:'',qty:1,colour:'',status:'New Job'}]).map(itemRow).join('')}</div><button type="button" class="btn secondary" onclick="addItem()">+ Add another item</button><div class="toolbar" style="margin-top:20px"><button type="submit" class="btn">${j?'Save Changes':'Create Job Card'}</button><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button></div></form>`)}
function submitJob(e,id){e.preventDefault();let f=e.target,items=[...f.querySelectorAll('.itemrow')].map(el=>({name:el.querySelector('.iname').value.trim(),qty:Number(el.querySelector('.iqty').value),colour:el.querySelector('.icolour').value.trim(),status:el.querySelector('.istatus').value}));if(!items.length||items.some(i=>!i.name||!Number.isInteger(i.qty)||i.qty<1)){alert('Add at least one item with a description and valid quantity.');return}let j=id?db.jobs.find(j=>j.id===id):{id:crypto.randomUUID(),number:'JC-'+String(db.next++).padStart(5,'0'),stage:0,created:new Date().toISOString(),messages:[],history:[]};let oldDue=j.due;j.customer=f.customer.value.trim();j.phone=f.phone.value.trim();j.received=f.received.value;j.due=f.due.value;j.notes=f.notes.value.trim();j.items=items;j.updated=new Date().toISOString();if(!id)db.jobs.push(j);log(j,id?'Job details updated':'Job created');if(id&&oldDue!==j.due&&days(oldDue)<0&&j.stage<4)notify(j,'delay');save();closeModal();render();if(!id)openJob(j.id)}
function openJob(id){let j=db.jobs.find(j=>j.id===id);if(!j)return;show(`<div class="modalhead"><div><h2>${esc(j.number)} · ${esc(j.customer)}</h2><span class="muted small">Received ${fmtDate(j.received)} · Due ${fmtDate(j.due)}</span></div><button class="close" onclick="closeModal()">✕</button></div><div class="row"><span>${badge(j)}</span><button class="btn secondary" onclick="newJob('${id}')">Edit Details</button></div><h3 style="margin-top:18px">Production stage</h3><div class="stage">${STAGES.map((s,i)=>`<span class="${i===j.stage?'current':''}">${esc(s)}</span>`).join('')}</div><div class="field"><label>Move job to</label><select id="stageSelect">${STAGES.map((s,i)=>`<option value="${i}" ${i===j.stage?'selected':''}>${esc(s)}</option>`).join('')}</select></div><button class="btn" onclick="changeStage('${id}')">Update Progress</button><h3 style="margin-top:20px">Items</h3>${j.items.map(i=>`<div class="log"><b>${esc(i.qty)} × ${esc(i.name)}</b> · ${esc(i.colour||'No colour')}<br><span class="muted">${esc(i.status)}</span></div>`).join('')}<div class="field" style="margin-top:16px"><label>Notes</label><p>${esc(j.notes||'No notes')}</p></div><h3>Invoice PDF</h3><div class="note">Upload an invoice PDF here. In the live app, ENDURA JC will fetch the PDF directly from Sage and store it in this file section. Sage is not connected in this demo.</div><div class="field" style="margin-top:12px"><label>Upload PDF (max 2 MB in this demo)</label><input id="invoiceFile" type="file" accept="application/pdf" onchange="attachInvoice('${id}')"></div><div class="toolbar">${j.invoiceData?`<button class="btn secondary" onclick="downloadInvoice('${id}')">Open Invoice PDF</button>`:''}</div><p class="muted small">${esc(j.invoiceName||'No uploaded invoice')}</p><h3 style="margin-top:18px">Customer updates</h3><div class="toolbar"><button class="btn secondary" onclick="queueDelay('${id}')">Prepare Delay WhatsApp</button>${j.stage===4?`<span class="muted small">Collection notification: ${esc(j.collectionDelivery==='sent'?'Sent':'Awaiting live integration — not sent')}</span>`:''}</div><h3 style="margin-top:18px">Activity</h3>${(j.history||[]).map(h=>`<div class="log">${esc(h.detail)}<br><time>${fmt(h.date)}</time></div>`).join('')||'<p class="muted">No activity yet</p>'}<div class="toolbar" style="margin-top:20px"><button class="btn secondary" onclick="printJob('${id}')">Print Job Card</button><button class="btn secondary" onclick="deleteJob('${id}')">Delete Job</button></div>`)}
function changeStage(id){let j=db.jobs.find(j=>j.id===id),n=Number(document.getElementById('stageSelect').value);if(n===j.stage)return;let old=j.stage;j.stage=n;j.updated=new Date().toISOString();log(j,`${STAGES[old]} → ${STAGES[n]}`);if(n===4&&old!==4){j.collectionDelivery='awaiting_integration';log(j,'Collection WhatsApp + invoice queued; awaiting live Sage/WhatsApp integration. Not sent.')}save();openJob(id)}
function queueDelay(id){let j=db.jobs.find(j=>j.id===id);notify(j,'delay');log(j,'Delay WhatsApp prepared for approval');save();closeModal();view='messages';render()}
function queueReady(id){let j=db.jobs.find(j=>j.id===id);j.collectionDelivery='awaiting_integration';log(j,'Collection notification queued for future automatic delivery (not sent)');save();openJob(id)}
function attachInvoice(id){let file=document.getElementById('invoiceFile').files[0];if(!file)return;if(file.type!=='application/pdf'||file.size>2*1024*1024){alert('Select a PDF smaller than 2 MB.');return}let r=new FileReader();r.onload=()=>{let j=db.jobs.find(j=>j.id===id);j.invoiceData=r.result;j.invoiceName=file.name;log(j,'Invoice PDF uploaded');save();openJob(id)};r.readAsDataURL(file)}
function downloadInvoice(id){let j=db.jobs.find(j=>j.id===id);if(j.invoiceData){let a=document.createElement('a');a.href=j.invoiceData;a.download=j.invoiceName||'invoice.pdf';a.click()}else if(j.invoiceUrl)window.open(j.invoiceUrl,'_blank','noopener')}
function deleteJob(id){if(!confirm('Permanently delete this job card?'))return;db.jobs=db.jobs.filter(j=>j.id!==id);save();closeModal();render()}
function printJob(id){let j=db.jobs.find(j=>j.id===id),w=window.open('','_blank');if(!w){alert('Allow popups to print');return}w.document.write(`<html><head><title>${esc(j.number)}</title><style>body{font:15px Arial;margin:36px;color:#222}h1{color:#991b1b}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:10px;text-align:left}</style></head><body><h1>ENDURA JC · ${esc(j.number)}</h1><p><b>Customer:</b> ${esc(j.customer)}<br><b>Phone:</b> ${esc(j.phone)}<br><b>Received:</b> ${fmtDate(j.received)}<br><b>Due:</b> ${fmtDate(j.due)}<br><b>Stage:</b> ${esc(STAGES[j.stage])}</p><table><tr><th>Item</th><th>Qty</th><th>Colour</th><th>Progress</th></tr>${j.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${esc(i.colour)}</td><td>${esc(i.status)}</td></tr>`).join('')}</table><p><b>Notes:</b> ${esc(j.notes)}</p></body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render()}));document.getElementById('dialog').addEventListener('click',e=>{if(e.target.id==='dialog')closeModal()});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
